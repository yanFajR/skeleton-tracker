<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>Masuk · Motion Tracker</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/style.css') }}?v=16"
    />
  </head>
  <body>
    <main class="container login-container">
      <section class="card login-card" aria-labelledby="login-title">
        <div class="brand-row">
          <p class="app-name">Motion Tracker</p>
          <span class="brand-divider" aria-hidden="true"></span>
          <p class="brand-description">Analisis gerakan</p>
        </div>
        <div class="section-heading">
          <span class="step-number" aria-hidden="true">—</span>
          <div>
            <p class="eyebrow">AKSES TERBATAS</p>
            <h2 id="login-title">Masuk</h2>
          </div>
        </div>
        <p class="section-copy">
          Hanya pengguna terdaftar yang dapat membuka analisis video.
        </p>
        {% if error %}
        <p class="status error login-error" role="alert">{{ error }}</p>
        {% endif %}
        <form method="post" action="/login" class="login-form" autocomplete="on">
          <input type="hidden" name="next" value="{{ next }}" />
          <label class="field-label" for="login-username">Nama pengguna</label>
          <input
            id="login-username"
            name="username"
            type="text"
            value="{{ username }}"
            autocomplete="username"
            maxlength="64"
            spellcheck="false"
            required
            autofocus
          />
          <label class="field-label" for="login-password">Kata sandi</label>
          <input
            id="login-password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="256"
            required
          />
          <button type="submit">Masuk</button>
        </form>
        <p class="hint login-hint">Sesi berakhir otomatis setelah 8 jam.</p>
      </section>
    </main>
  </body>
</html>
